name: Generate snake contribution graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Modernist palette: one red on a warm ground
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ec3013&color_dots=#eae7e7,#ffc4b8,#ff9783,#ff563c,#ae1800
            dist/github-snake-dark.svg?color_snake=#ec3013&color_dots=#21262d,#4d170e,#7c1405,#ae1800,#ec3013

      - name: Commit
        run: |
          cp dist/github-snake.svg dist/github-snake-dark.svg assets/
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --staged --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update snake"
          git push
